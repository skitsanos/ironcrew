name: Release

on:
  repository_dispatch:
    types: [ironcrew_release_v1]

permissions: {}

# Serialize release selection with registry promotion/latest repair in the
# manual publisher. GitHub concurrency groups span workflows in a repository.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BASE_IMAGE_REFERENCE: cgr.dev/chainguard/wolfi-base
  BASE_IMAGE_INDEX_DIGEST: sha256:0a8fd427de5882aed77471b0a432c3675eda6b6a0ae952b5d640b46da628cdbe

jobs:
  guard:
    name: Authorize release from trusted main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      mode: ${{ steps.dispatch.outputs.mode }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - name: Bind event to the default-branch workflow
        env:
          DISPATCH_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$DISPATCH_ACTION" = ironcrew_release_v1
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"

      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind checkout to the trusted workflow commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate exact repository-dispatch payload
        id: dispatch
        run: >-
          python3 -B scripts/validate_release_dispatch.py
          --event "$GITHUB_EVENT_PATH"
          --event-type ironcrew_release_v1
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --output "$GITHUB_OUTPUT"

      - name: Check out tag source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: tag-source
          persist-credentials: false
          ref: refs/tags/${{ steps.dispatch.outputs.tag }}

      - name: Verify tag version, type, and main ancestry
        id: source
        working-directory: tag-source
        env:
          RELEASE_TAG: ${{ steps.dispatch.outputs.tag }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          ../scripts/verify_release_source.sh "$RELEASE_TAG" refs/remotes/origin/main
          commit_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          source_date_epoch=$(git show -s --format=%ct "$commit_sha")
          test "$(git rev-parse HEAD)" = "$commit_sha"
          {
            echo "tag=$RELEASE_TAG"
            echo "commit_sha=$commit_sha"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    if: needs.guard.outputs.mode == 'publish'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ironcrew-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ironcrew-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ironcrew-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ironcrew-macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.guard.outputs.commit_sha }}

      - name: Bind build checkout to the authorized tag commit
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      # Keep release artifacts aligned with Cargo.toml's rust-version and the
      # source Dockerfile instead of silently moving with the stable channel.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz ironcrew
          cd ../../..
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  image:
    name: Build immutable release image
    needs: [guard, build]
    if: needs.guard.outputs.mode == 'publish' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.guard.outputs.commit_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.source_date_epoch }}
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check out authorized tag source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tag-source
          persist-credentials: false
          ref: ${{ needs.guard.outputs.commit_sha }}

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ironcrew-*
          path: artifacts

      - name: Prepare immutable image inputs
        run: |
          mkdir release
          expected="${RUNNER_TEMP}/ironcrew-binary-files.expected"
          observed="${RUNNER_TEMP}/ironcrew-binary-files.observed"
          printf '%s\n' \
            ironcrew-linux-amd64.tar.gz \
            ironcrew-linux-amd64.tar.gz.sha256 \
            ironcrew-linux-arm64.tar.gz \
            ironcrew-linux-arm64.tar.gz.sha256 \
            ironcrew-macos-amd64.tar.gz \
            ironcrew-macos-amd64.tar.gz.sha256 \
            ironcrew-macos-arm64.tar.gz \
            ironcrew-macos-arm64.tar.gz.sha256 \
            | LC_ALL=C sort > "$expected"
          test "$(find artifacts -type l | wc -l | tr -d ' ')" = 0
          find artifacts -type f -exec basename {} \; | LC_ALL=C sort > "$observed"
          diff --unified=0 "$expected" "$observed"
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} release/ \;
          cd release
          sha256sum --check ironcrew-linux-amd64.tar.gz.sha256
          sha256sum --check ironcrew-linux-arm64.tar.gz.sha256
          cd ..
          mkdir -p tag-source/dist/linux/amd64 tag-source/dist/linux/arm64
          tar xzf release/ironcrew-linux-amd64.tar.gz -C tag-source/dist/linux/amd64
          tar xzf release/ironcrew-linux-arm64.tar.gz -C tag-source/dist/linux/arm64
          test -x tag-source/dist/linux/amd64/ironcrew
          test -x tag-source/dist/linux/arm64/ironcrew

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build tag-owned multi-platform OCI archive once
        run: |
          archive="release/ironcrew-${RELEASE_TAG}-linux-oci.tar"
          docker buildx build \
            --file tag-source/docker/runtime.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output "type=oci,dest=${archive},tar=true,rewrite-timestamp=true" \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            tag-source

      - name: Create and verify strict image receipt
        run: |
          archive="release/ironcrew-${RELEASE_TAG}-linux-oci.tar"
          receipt="release/ironcrew-${RELEASE_TAG}-image-receipt.v1.json"
          buildx_version=$(docker buildx version | tr -d '\n')
          python3 -B scripts/release_image_receipt.py generate \
            --receipt "$receipt" \
            --archive "$archive" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dockerfile tag-source/docker/runtime.Dockerfile \
            --base-reference "$BASE_IMAGE_REFERENCE" \
            --base-digest "$BASE_IMAGE_INDEX_DIGEST" \
            --builder-implementation docker-buildx \
            --builder-version "$buildx_version" \
            --binary "linux/amd64=ironcrew-linux-amd64.tar.gz=release/ironcrew-linux-amd64.tar.gz" \
            --binary "linux/arm64=ironcrew-linux-arm64.tar.gz=release/ironcrew-linux-arm64.tar.gz"
          python3 -B scripts/verify_release_image.py \
            --receipt "$receipt" \
            --archive "$archive" \
            --tag "$RELEASE_TAG"
          (
            cd release
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
            sha256sum "$(basename "$receipt")" > "$(basename "$receipt").sha256"
          )

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: tag-source
          format: cyclonedx-json
          output-file: release/ironcrew-${{ needs.guard.outputs.tag }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload bounded release image assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironcrew-release-image
          if-no-files-found: error
          path: |
            release/ironcrew-${{ needs.guard.outputs.tag }}-linux-oci.tar
            release/ironcrew-${{ needs.guard.outputs.tag }}-linux-oci.tar.sha256
            release/ironcrew-${{ needs.guard.outputs.tag }}-image-receipt.v1.json
            release/ironcrew-${{ needs.guard.outputs.tag }}-image-receipt.v1.json.sha256
            release/ironcrew-${{ needs.guard.outputs.tag }}-sbom.cdx.json

  validate:
    name: Validate protected release authority
    needs: guard
    if: needs.guard.outputs.mode == 'validate'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Confirm safe canary boundary
        env:
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.guard.outputs.commit_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_COMMIT"
          echo "Protected release authority validated without publication."

  release:
    name: Create Release
    needs: [guard, build, image]
    if: >-
      needs.guard.outputs.mode == 'publish' &&
      needs.build.result == 'success' &&
      needs.image.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.guard.outputs.commit_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.source_date_epoch }}
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind release controls to trusted main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out authorized tag source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: tag-source
          persist-credentials: false
          ref: ${{ needs.guard.outputs.commit_sha }}

      - name: Revalidate the tag-to-commit binding
        working-directory: tag-source
        run: |
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          ../scripts/verify_release_source.sh "$RELEASE_TAG" refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git show -s --format=%ct "$RELEASE_COMMIT")" = "$SOURCE_DATE_EPOCH"

      - name: Refuse release-asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B scripts/verify_release_absent.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect and strictly verify release files
        run: |
          mkdir release
          expected="${RUNNER_TEMP}/ironcrew-release-files.expected"
          observed="${RUNNER_TEMP}/ironcrew-release-files.observed"
          {
            printf '%s\n' \
              ironcrew-linux-amd64.tar.gz \
              ironcrew-linux-amd64.tar.gz.sha256 \
              ironcrew-linux-arm64.tar.gz \
              ironcrew-linux-arm64.tar.gz.sha256 \
              ironcrew-macos-amd64.tar.gz \
              ironcrew-macos-amd64.tar.gz.sha256 \
              ironcrew-macos-arm64.tar.gz \
              ironcrew-macos-arm64.tar.gz.sha256 \
              "ironcrew-${RELEASE_TAG}-image-receipt.v1.json" \
              "ironcrew-${RELEASE_TAG}-image-receipt.v1.json.sha256" \
              "ironcrew-${RELEASE_TAG}-linux-oci.tar" \
              "ironcrew-${RELEASE_TAG}-linux-oci.tar.sha256" \
              "ironcrew-${RELEASE_TAG}-sbom.cdx.json"
          } | LC_ALL=C sort > "$expected"
          test "$(find artifacts -type l | wc -l | tr -d ' ')" = 0
          find artifacts -type f -exec basename {} \; | LC_ALL=C sort > "$observed"
          diff --unified=0 "$expected" "$observed"
          find artifacts -type f -exec mv {} release/ \;
          echo "## Checksums" > release/checksums.txt
          cat release/*.sha256 >> release/checksums.txt
          cd release
          sha256sum --check ./*.sha256
          cd ..
          python3 -B scripts/verify_release_image.py \
            --receipt "release/ironcrew-${RELEASE_TAG}-image-receipt.v1.json" \
            --archive "release/ironcrew-${RELEASE_TAG}-linux-oci.tar" \
            --tag "$RELEASE_TAG"
          python3 -B scripts/verify_release_bindings.py \
            --receipt "release/ironcrew-${RELEASE_TAG}-image-receipt.v1.json" \
            --commit-sha "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dockerfile tag-source/docker/runtime.Dockerfile \
            --binary "linux/amd64=ironcrew-linux-amd64.tar.gz=release/ironcrew-linux-amd64.tar.gz" \
            --binary "linux/arm64=ironcrew-linux-arm64.tar.gz=release/ironcrew-linux-arm64.tar.gz"
          cat release/checksums.txt

      # Keyless signing: cosign fetches an OIDC token from GitHub and
      # requests a short-lived certificate from Fulcio. No secrets or
      # static keys involved. Cosign v3 bundles the signature and
      # certificate into a single <artifact>.bundle JSON file
      # (the separate .sig / .pem outputs from v2 are replaced).
      # Verifiers use `cosign verify-blob --bundle ...`.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with cosign
        run: |
          cd release
          for artifact in \
            ironcrew-linux-amd64.tar.gz \
            ironcrew-linux-arm64.tar.gz \
            ironcrew-macos-amd64.tar.gz \
            ironcrew-macos-arm64.tar.gz \
            ironcrew-${RELEASE_TAG}-sbom.cdx.json \
            ironcrew-${RELEASE_TAG}-linux-oci.tar \
            ironcrew-${RELEASE_TAG}-image-receipt.v1.json; do
            test -f "$artifact"
            echo "Signing $artifact"
            cosign sign-blob --yes \
              --bundle "$artifact.bundle" \
              "$artifact"
            test -s "$artifact.bundle"
          done

      - name: Verify exact published asset set
        run: |
          expected="${RUNNER_TEMP}/ironcrew-published-files.expected"
          observed="${RUNNER_TEMP}/ironcrew-published-files.observed"
          {
            printf '%s\n' \
              checksums.txt \
              ironcrew-linux-amd64.tar.gz \
              ironcrew-linux-amd64.tar.gz.bundle \
              ironcrew-linux-amd64.tar.gz.sha256 \
              ironcrew-linux-arm64.tar.gz \
              ironcrew-linux-arm64.tar.gz.bundle \
              ironcrew-linux-arm64.tar.gz.sha256 \
              ironcrew-macos-amd64.tar.gz \
              ironcrew-macos-amd64.tar.gz.bundle \
              ironcrew-macos-amd64.tar.gz.sha256 \
              ironcrew-macos-arm64.tar.gz \
              ironcrew-macos-arm64.tar.gz.bundle \
              ironcrew-macos-arm64.tar.gz.sha256 \
              "ironcrew-${RELEASE_TAG}-image-receipt.v1.json" \
              "ironcrew-${RELEASE_TAG}-image-receipt.v1.json.bundle" \
              "ironcrew-${RELEASE_TAG}-image-receipt.v1.json.sha256" \
              "ironcrew-${RELEASE_TAG}-linux-oci.tar" \
              "ironcrew-${RELEASE_TAG}-linux-oci.tar.bundle" \
              "ironcrew-${RELEASE_TAG}-linux-oci.tar.sha256" \
              "ironcrew-${RELEASE_TAG}-sbom.cdx.json" \
              "ironcrew-${RELEASE_TAG}-sbom.cdx.json.bundle"
          } | LC_ALL=C sort > "$expected"
          find release -mindepth 1 -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$observed"
          diff --unified=0 "$expected" "$observed"

      - name: Write release notes from tag annotation
        run: |
          # The release guard requires an annotated tag. Keep the fallback for
          # an intentionally empty annotation, and write arbitrary Markdown to
          # a file rather than a delimiter-based workflow output.
          TAG_BODY=$(git -C tag-source for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)')
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY="IronCrew ${RELEASE_TAG}"
          fi
          RELEASE_BODY_PATH="${RUNNER_TEMP}/ironcrew-release-body.md"
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          {
            printf '%s\n' \
              "$TAG_BODY" \
              '' \
              '---' \
              '' \
              '### Installation' \
              '' \
              '```bash' \
              '# macOS (Apple Silicon)' \
              'tar xzf ironcrew-macos-arm64.tar.gz' \
              '' \
              '# macOS (Intel)' \
              'tar xzf ironcrew-macos-amd64.tar.gz' \
              '' \
              '# Linux (x86_64)' \
              'tar xzf ironcrew-linux-amd64.tar.gz' \
              '' \
              '# Linux (ARM64)' \
              'tar xzf ironcrew-linux-arm64.tar.gz' \
              '' \
              '# Move to PATH' \
              'chmod +x ironcrew' \
              'sudo mv ironcrew /usr/local/bin/' \
              '```' \
              '' \
              '### Verifying signatures' \
              '' \
              'Each archive is signed with [cosign](https://github.com/sigstore/cosign) via keyless GitHub OIDC:' \
              '' \
              '```bash' \
              "cosign verify-blob \\" \
              "  --bundle ironcrew-linux-amd64.tar.gz.bundle \\" \
              "  --certificate-identity '$CERTIFICATE_IDENTITY' \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\" \
              '  ironcrew-linux-amd64.tar.gz' \
              '```' \
              '' \
              'The release also includes a signed, multi-platform OCI archive and a strict receipt.' \
              'Registry publication promotes that exact archive; it does not rebuild historical source.' \
              ''
            printf "The SBOM is at \`ironcrew-%s-sbom.cdx.json\` (CycloneDX 1.x).\n" \
              "$RELEASE_TAG"
          } > "$RELEASE_BODY_PATH"

      # `gh release create` refuses an existing release; unlike an update-capable
      # release action, the final publication primitive cannot replace assets.
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "IronCrew $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/ironcrew-release-body.md" \
            --verify-tag \
            --latest \
            -- \
            release/*
