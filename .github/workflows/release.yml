name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag version and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          ./scripts/verify_release_source.sh "$TAG_NAME" refs/remotes/origin/main

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ironcrew-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ironcrew-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ironcrew-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ironcrew-macos-arm64

    steps:
      - uses: actions/checkout@v7

      # Keep release artifacts aligned with Cargo.toml's rust-version and the
      # source Dockerfile instead of silently moving with the stable channel.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz ironcrew
          cd ../../..
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} release/ \;
          echo "## Checksums" > release/checksums.txt
          cat release/*.sha256 >> release/checksums.txt
          cat release/checksums.txt

      # CycloneDX SBOM generated from Cargo.lock via Syft. Lands in the
      # release bundle as ironcrew-<tag>-sbom.cdx.json so downstream
      # consumers can audit the dependency tree of a specific release.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/ironcrew-${{ github.ref_name }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Keyless signing: cosign fetches an OIDC token from GitHub and
      # requests a short-lived certificate from Fulcio. No secrets or
      # static keys involved. Cosign v3 bundles the signature and
      # certificate into a single <artifact>.bundle JSON file
      # (the separate .sig / .pem outputs from v2 are replaced).
      # Verifiers use `cosign verify-blob --bundle ...`.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts with cosign
        run: |
          cd release
          for artifact in *.tar.gz ironcrew-${GITHUB_REF_NAME}-sbom.cdx.json; do
            [ -f "$artifact" ] || continue
            echo "Signing $artifact"
            cosign sign-blob --yes \
              --bundle "$artifact.bundle" \
              "$artifact"
          done

      - name: Write release notes from tag annotation
        run: |
          # The release guard requires an annotated tag. Keep the fallback for
          # an intentionally empty annotation, and write arbitrary Markdown to
          # a file rather than a delimiter-based workflow output.
          TAG_BODY=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY="IronCrew ${GITHUB_REF_NAME}"
          fi
          RELEASE_BODY_PATH="${RUNNER_TEMP}/ironcrew-release-body.md"
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          {
            printf '%s\n' \
              "$TAG_BODY" \
              '' \
              '---' \
              '' \
              '### Installation' \
              '' \
              '```bash' \
              '# macOS (Apple Silicon)' \
              'tar xzf ironcrew-macos-arm64.tar.gz' \
              '' \
              '# macOS (Intel)' \
              'tar xzf ironcrew-macos-amd64.tar.gz' \
              '' \
              '# Linux (x86_64)' \
              'tar xzf ironcrew-linux-amd64.tar.gz' \
              '' \
              '# Linux (ARM64)' \
              'tar xzf ironcrew-linux-arm64.tar.gz' \
              '' \
              '# Move to PATH' \
              'chmod +x ironcrew' \
              'sudo mv ironcrew /usr/local/bin/' \
              '```' \
              '' \
              '### Verifying signatures' \
              '' \
              'Each archive is signed with [cosign](https://github.com/sigstore/cosign) via keyless GitHub OIDC:' \
              '' \
              '```bash' \
              "cosign verify-blob \\" \
              "  --bundle ironcrew-linux-amd64.tar.gz.bundle \\" \
              "  --certificate-identity '$CERTIFICATE_IDENTITY' \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\" \
              '  ironcrew-linux-amd64.tar.gz' \
              '```' \
              ''
            printf "The SBOM is at \`ironcrew-%s-sbom.cdx.json\` (CycloneDX 1.x).\n" \
              "$GITHUB_REF_NAME"
          } > "$RELEASE_BODY_PATH"

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          name: IronCrew ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/ironcrew-release-body.md
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
