name: Live provider compatibility smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # No PR/fork checkout, arbitrary ref, model, command or spending inputs.
    # Both execution routes stay dormant until the owner configures protection
    # and explicitly enables the repository/environment variables below.
    if: >-
      github.repository == 'skitsanos/ironcrew' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.IRONCREW_LIVE_SMOKE_APPROVED == 'true' &&
      ((github.event_name == 'schedule' && vars.IRONCREW_LIVE_SMOKE_NIGHTLY == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'skitsanos'))
    environment: live-provider-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --bin ironcrew
      - name: Verify harness without credentials
        env:
          IRONCREW_SMOKE_TEST_BIN: target/debug/ironcrew
        run: python3 -B -m unittest discover -s evaluations/live-smoke -p 'test_*.py'
      - name: Run the fixed approved Luna envelope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IRONCREW_LIVE_SMOKE: '1'
        run: >-
          python3 -B evaluations/live-smoke/smoke.py --mode live
          --binary target/debug/ironcrew --max-cost-usd 0.15
          --report "$RUNNER_TEMP/ironcrew-live-smoke.json"
      - name: Retain only the sanitized receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ironcrew-live-smoke.json
          retention-days: 7
          if-no-files-found: ignore
