name: Docker Publish

# Default-branch repository dispatch promotes only the signed OCI archive
# produced by release.yml. It never rebuilds an image from this checkout.
# `validate` mode traverses the protected environment without registry writes;
# `publish` authorizes exact promotion and bounded reconciliation of `latest`.
on:
  repository_dispatch:
    types: [ironcrew_docker_publish_v1]

permissions: {}

env:
  IMAGE: skitsanos/ironcrew

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  guard:
    name: Authorize promotion from trusted main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.dispatch.outputs.tag }}
      mode: ${{ steps.dispatch.outputs.mode }}
    steps:
      - name: Bind event to the default-branch workflow
        env:
          DISPATCH_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$DISPATCH_ACTION" = ironcrew_docker_publish_v1
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"

      - name: Check out trusted promotion controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind checkout to the trusted workflow commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate exact repository-dispatch payload
        id: dispatch
        run: >-
          python3 -B scripts/validate_release_dispatch.py
          --event "$GITHUB_EVENT_PATH"
          --event-type ironcrew_docker_publish_v1
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --output "$GITHUB_OUTPUT"

  validate:
    name: Validate protected promotion authority
    needs: guard
    if: needs.guard.outputs.mode == 'validate'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Confirm safe canary boundary
        env:
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -n "$RELEASE_TAG"
          echo "Protected promotion authority validated without registry access."

  publish:
    name: Promote signed release image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.guard.outputs.mode == 'publish'
    environment: release
    permissions:
      contents: read
    steps:
      # This checkout supplies only the promotion verifier. Image bytes come
      # exclusively from the tag-bound, signed GitHub release assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind promotion controls to trusted main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install promotion transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote signed release image and reconcile latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ needs.guard.outputs.tag }}
        run: |
          python3 -B scripts/promote_release_image.py \
            --tag "$RELEASE_TAG_INPUT" \
            --repository "$GITHUB_REPOSITORY" \
            --image "$IMAGE" \
            --authorize-latest-reconciliation \
            --max-latest-attempts 3
