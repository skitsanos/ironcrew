name: Docker Publish

# Manual publication promotes only the signed OCI archive produced by
# release.yml. It never rebuilds an image from this checkout. The explicit
# authorization also covers bounded reconciliation of `latest` if GitHub's
# current stable release changes while this workflow is running.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact stable release tag to promote (for example v2.24.0)."
        required: true
        type: string
      authorize_latest_reconciliation:
        description: "Authorize exact version promotion and bounded reconciliation of latest to GitHub's current signed stable release."
        required: true
        type: boolean
        default: false

permissions: {}

env:
  IMAGE: skitsanos/ironcrew

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Promote signed release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.authorize_latest_reconciliation == true
    permissions:
      contents: read
    steps:
      # This checkout supplies only the promotion verifier. Image bytes come
      # exclusively from the tag-bound, signed GitHub release assets.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install promotion transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote signed release image and reconcile latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          python3 -B scripts/promote_release_image.py \
            --tag "$RELEASE_TAG_INPUT" \
            --repository "$GITHUB_REPOSITORY" \
            --image "$IMAGE" \
            --authorize-latest-reconciliation \
            --max-latest-attempts 3
