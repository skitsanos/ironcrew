name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR)
# so we don't burn CI minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    env:
      IRONCREW_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Check Rust module size policy
        run: python3 -B scripts/check_module_size.py
      - name: Test Rust module size policy checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: bun run scripts/validate_skills.ts
      - name: Validate issue registry against trusted history
        run: bun run scripts/issues_registry.ts check
      - run: bun test scripts/tests/*.test.ts
      - run: bun run scripts/check_worktree.ts
      - run: bun install --frozen-lockfile --cwd=examples/chat-ui
      - run: bun build examples/chat-ui/src/index.html --outdir=/tmp/ironcrew-chat-ui
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml'

  rust-default:
    name: Format, Clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo build --no-default-features
      - run: cargo clippy --no-default-features --bin ironcrew -- -D warnings
      - run: cargo test --no-default-features --test history_reader_test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-targets

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      # Both ends of the support window run inside this one job so the
      # ruleset's required check name stays "PostgreSQL integration".
      postgres:
        # Latest stable PostgreSQL; historical receipts keep their versions.
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironcrew_ci_admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-floor:
        # Release-time floor, retained throughout IronCrew 4.x.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironcrew_ci_admin
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRONCREW_TEST_PG_URL: postgres://ironcrew_ci:ironcrew_ci_password@localhost:5432/ironcrew_test
      IRONCREW_TEST_PG_FLOOR_URL: postgres://ironcrew_ci:ironcrew_ci_password@localhost:5433/ironcrew_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Create isolated test databases (latest and floor)
        env:
          PGPASSWORD: ironcrew_ci_admin
        run: |
          for port in 5432 5433; do
            psql --host localhost --port "$port" --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ironcrew_ci LOGIN PASSWORD 'ironcrew_ci_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;
          CREATE DATABASE ironcrew_test OWNER ironcrew_ci;
          \connect ironcrew_test
          GRANT USAGE, CREATE ON SCHEMA public TO ironcrew_ci;
          SELECT version();
          SQL
          done
      - name: Test replica lifecycle harness contracts
        run: python3 -B -m unittest discover -s evaluations/replica-lifecycle -p 'test_*.py'
      - name: Run PostgreSQL integration tests on floor and latest stable
        run: bun --no-env-file run scripts/check-postgres.ts
      - name: Run replica soak contract smoke
        run: |
          python3 -m unittest discover \
            -s evaluations/replica-soak \
            -p 'test_*.py'
          DATABASE_URL="$IRONCREW_TEST_PG_URL" \
          python3 evaluations/replica-soak/soak.py \
            --binary target/debug/ironcrew \
            --runs 2 \
            --duration-seconds 30 \
            --concurrency 1 \
            --report /tmp/ironcrew-replica-soak-ci/result.json
      - name: Upload replica soak contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replica-soak-contract
          path: /tmp/ironcrew-replica-soak-ci
          if-no-files-found: ignore

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets

  lua-examples:
    name: Lua examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --bin ironcrew
      - run: ./scripts/check-lua-examples.sh

  crew-effectiveness-contract:
    name: Crew effectiveness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --bin ironcrew
      - name: Test evaluator and orchestration contract
        run: |
          python3 -m unittest discover \
            -s evaluations/crew-effectiveness \
            -p 'test_*.py'
          python3 evaluations/crew-effectiveness/evaluate.py \
            --mode contract \
            --binary target/debug/ironcrew \
            --report /tmp/ironcrew-crew-effectiveness-contract.json
      - name: Test live-smoke controls and CLI/HTTP contract without credentials
        env:
          IRONCREW_SMOKE_TEST_BIN: target/debug/ironcrew
        run: python3 -B -m unittest discover -s evaluations/live-smoke -p 'test_*.py'

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.package.outputs.receipt_sha256 }}
    env:
      QUALIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Require unchanged source before the release build
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - run: cargo build --release --locked
      - name: Binary size
        run: ls -lh target/release/ironcrew
      - name: Package exact-source executable and checksums (unpublished)
        id: package
        run: |
          python3 -B scripts/history_reader_artifact.py package \
            --binary target/release/ironcrew --output "$RUNNER_TEMP/history-artifact" \
            --commit "$QUALIFIED_COMMIT" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain immutable candidate artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-reader-linux-amd64-${{ env.QUALIFIED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-artifact/*
          if-no-files-found: error
          retention-days: 14

  history-reader-artifact:
    name: History reader artifact (${{ matrix.postgres }})
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        postgres: ['17', latest]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: artifact_fixture_admin
          POSTGRES_DB: history_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d history_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUALIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RECEIPT_SHA256: ${{ needs.release-build.outputs.receipt_sha256 }}
      HISTORY_FIXTURE_ADMIN_URL: postgres://postgres:artifact_fixture_admin@localhost:5432/history_fixture
      DATABASE_URL: postgres://history_reader:history_fixture_password@localhost:5432/history_fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_COMMIT }}
          persist-credentials: false
      - name: Download this run's exact immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/history-artifact
          merge-multiple: true
      - name: Verify source, run, receipt, archive and executable identities
        run: |
          python3 -B scripts/history_reader_artifact.py verify \
            --directory "$RUNNER_TEMP/history-artifact" --output "$RUNNER_TEMP/history-executable" \
            --commit "$QUALIFIED_COMMIT" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt-sha256 "$RECEIPT_SHA256"
      - name: Test downloaded executable with SELECT-only synthetic historical records
        run: |
          python3 -B scripts/check_history_reader_artifact.py \
            --binary "$RUNNER_TEMP/history-executable/ironcrew" \
            --output "$RUNNER_TEMP/history-result/result.json"
      - name: Retain aggregate acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-reader-evidence-${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-result/result.json
          if-no-files-found: error
          retention-days: 14
