name: Release Request Controller

# Issues are the sole owner's low-authority request channel. GitHub evaluates
# this workflow from the default branch, and GITHUB_TOKEN exists only for this
# run. The controller dispatches the existing hardened publication workflows;
# it never publishes artifacts or registry content itself.
on:
  issues:
    types: [labeled]

permissions: {}

# Applying the exact label is one authorization. Removing and reapplying it or
# rerunning this workflow is an intentional owner-authorized replay, not a
# deduplicated request. Runs for one issue serialize, both actors are bound to
# the owner, and downstream publication workflows fail closed on unsafe replay.
concurrency:
  group: release-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate sole-owner release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      relevant: ${{ steps.request.outputs.relevant }}
      target: ${{ steps.request.outputs.target }}
      tag: ${{ steps.request.outputs.tag }}
      mode: ${{ steps.request.outputs.mode }}
    steps:
      - name: Bind request to trusted main controls
        env:
          EVENT_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = issues
          test "$EVENT_ACTION" = labeled
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/release-request.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"

      - name: Check out trusted request controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind checkout to the trusted workflow commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate exact issue request
        id: request
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: >-
          python3 -B scripts/validate_release_request.py
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --triggering-actor "$TRIGGERING_ACTOR"
          --owner skitsanos
          --output "$GITHUB_OUTPUT"

  dispatch:
    name: Dispatch trusted release workflow
    needs: guard
    if: needs.guard.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_MODE: ${{ needs.guard.outputs.mode }}
    steps:
      - name: Dispatch GitHub release workflow
        if: needs.guard.outputs.target == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=ironcrew_release_v1 \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[mode]=${RELEASE_MODE}"

      - name: Dispatch Docker promotion workflow
        if: needs.guard.outputs.target == 'docker'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=ironcrew_docker_publish_v1 \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[mode]=${RELEASE_MODE}"
