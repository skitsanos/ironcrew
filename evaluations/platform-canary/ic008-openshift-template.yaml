      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: outputs
          emptyDir:
            sizeLimit: 256Mi
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ${NAME_PREFIX}-postgres
      labels:
        app.kubernetes.io/name: ${NAME_PREFIX}-postgres
        app.kubernetes.io/component: database
        ironcrew.io/test-run: ic008-conversation-20260811
        ironcrew.io/role: postgres
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: postgres-database
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: postgres-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/pgsql
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pg-tmp
              mountPath: /tmp
            - name: pg-shm
              mountPath: /dev/shm
      volumes:
        - name: pg-data
          emptyDir:
            sizeLimit: 2Gi
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pg-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: pg-shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ${NAME_PREFIX}-mock
      labels:
        app.kubernetes.io/name: ${NAME_PREFIX}-mock
        app.kubernetes.io/component: mock-provider
        ironcrew.io/test-run: ic008-conversation-20260811
        ironcrew.io/role: mock
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-provider
          image: ${MOCK_IMAGE}
          imagePullPolicy: Always
          command: ["python3", "${MOCK_SCRIPT}"]
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - --effect-url
            - http://${NAME_PREFIX}-mock:8081/effect
            - --blocking-content
            - ${BLOCKING_CONTENT}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /counts
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /counts
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
