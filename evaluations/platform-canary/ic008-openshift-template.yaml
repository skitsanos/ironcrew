        kind: Service
        name: ${NAME_PREFIX}-a
        weight: 100
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None
  - apiVersion: route.openshift.io/v1
    kind: Route
