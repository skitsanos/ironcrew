        ironcrew.io/test-run: ic008-conversation-20260811
    spec:
      type: ClusterIP
      selector:
        ironcrew.io/test-run: ic008-conversation-20260811
        ironcrew.io/role: postgres
      ports:
        - name: postgres
          port: 5432
          targetPort: postgres
          protocol: TCP
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME_PREFIX}-mock
      labels:
        app.kubernetes.io/name: ${NAME_PREFIX}-mock
        ironcrew.io/test-run: ic008-conversation-20260811
