[package]
name = "ironcrew"
version = "3.0.0"
edition = "2024"
description = "A runtime for Lua-defined AI agent crews"
license = "MIT"
rust-version = "1.97.1"
repository = "https://github.com/skitsanos/ironcrew"
keywords = ["ai", "agents", "lua", "crew", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ironcrew"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
mlua = { version = "0.12.0", features = ["lua54", "async", "send", "serialize", "vendored"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
scraper = "0.27.0"
dotenvy = "0.15.7"
uuid = { version = "1.25.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
bytes = { version = "1.12.1", optional = true }
thiserror = "2.0.20"
async-trait = "0.1.92"
url = "2.5.8"
sha2 = "0.11"
md-5 = "0.11"
tera = "2.2.0"
jsonschema = { version = "0.49.9", default-features = false }
glob = "0.3.4"
regex = "1.13.1"
futures = "0.3.34"
async-stream = "0.3.6"
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["json"], optional = true }
tower-http = { version = "0.7.0", features = ["cors"] }
rmcp = { version = "3.1.4", optional = true, default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "tower"] }
sse-stream = { version = "0.2.5", optional = true }
ring = "0.17.14"
zeroize = "1.9.0"
cap-std = "4.0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream", "windows"] }

[features]
default = ["postgres", "mcp"]
postgres = ["sqlx", "dep:sqlx-postgres"]
mcp = ["dep:bytes", "dep:rmcp", "dep:sse-stream"]

[dev-dependencies]
tempfile = "3.27.0"
portable-pty = "0.9.0"
# Used by the `postgres`-gated integration tests (`postgres_store_test`,
# `multi_replica_http_test`, `two_process_replica_acceptance` and its phase
# modules) for setup/teardown against a live database. Those tests are skipped
# unless IRONCREW_TEST_PG_URL is set. Declared unconditionally so the gated
# suites still compile when the `postgres` feature is toggled off.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
